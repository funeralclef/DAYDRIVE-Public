name: Release builds
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json
      - run: dotnet test --solution IntelligentScheduler.slnx -c Release
  package:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json
      - run: sudo apt-get update && sudo apt-get install -y nsis binutils
      - name: Check tag matches application version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os, xml.etree.ElementTree as E
          version = E.parse('src/IntelligentScheduler.Desktop/IntelligentScheduler.Desktop.csproj').getroot().findtext('PropertyGroup/Version')
          assert os.environ['RELEASE_TAG'] == 'v' + version
          PY
      - run: python3 scripts/package-release.py
      - run: python3 scripts/verify-release.py artifacts/release
      - name: Check Debian package installation
        run: |
          sudo apt-get install -y ./artifacts/release/*.deb
          test -x /opt/daydrive/DAYDRIVE
          test -L /usr/bin/daydrive
          daydrive --seed-demo=7 --data-dir="$RUNNER_TEMP/deb smoke data"
          sudo apt-get remove -y daydrive
          test -f "$RUNNER_TEMP/deb smoke data/intelligent-scheduler.db"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-packages
          path: artifacts/release/*
          if-no-files-found: error
  windows-packages:
    needs: package
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-packages
          path: artifacts/release
      - shell: pwsh
        run: ./scripts/verify-windows.ps1 -Packages artifacts/release
  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: windows-packages
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-packages
          path: artifacts/release
      - name: Publish validated packages
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" artifacts/release/* --verify-tag --title "DAYDRIVE ${RELEASE_TAG#v}" --notes-file docs/RELEASE-NOTES.md --latest
